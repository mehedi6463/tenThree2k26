<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * {
        margin: 0;
        padding: 0;
        }

        body {
        text-align: center;
        background-color: rgb(172, 247, 253);
        padding: 20px;
        }

        .container {
        max-width: 500px;
        margin: 50px auto;
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        h1 {
        font-size: 40px;
        padding-bottom: 20px;
        }

        input {
        width: 80%;
        padding: 8px 10px;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        button {
        background: #352ef6;
        padding: 8px 16px;
        border: none;
        border-radius: 5px;
        font-size: 15px;
        font-weight: 500;
        color: #fff;
        margin-top: 15px;
        transition: all 0.2s linear;
        cursor: pointer;
        }

        button:hover {
        background: red;
        }

        .weather-info {
        margin-top: 20px;
        }

    </style>
</head>
<body>
        <div class="container">
        <h1>Weather App</h1>
        <input type="text" id="city" placeholder="Enter a city name">
        <p id="cityNameAlert"></p>
        <button onclick="getWeather()">Get Weather</button>

        <div class="weather-info" id="weather">

        </div>
    </div>

    <script>
        async function getWeather() {
            // let apiKey = "3aa87561b6356091157ce46a194d79d9";
            let apiKey = "5642fcc283108176680d339c57073595";
            let city = document.getElementById('city').value;
            let msgAlert = document.getElementById('cityNameAlert');

            if(!city){
                msgAlert.innerHTML = "Please enter a city name";
                msgAlert.style.color = "red";
                msgAlert.style.margin = "10px";
                return;
            };

            let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

            try{
                let response = await fetch(url);
                let data = await response.json();

                console.log(data);
                if(data.cod === 200){
                    document.getElementById('weather').innerHTML = `

                    <h2> Country Name: ${data.name} (${data.sys.country}) </h2>
                    <p> Temperature: ${data.main.temp} &deg;C </p>
                    <p> Weather: ${data.weather[0].description} </p>
                    <p> Humidity: ${data.main.humidity}% </p>

                    `;
                }
                else{
                    document.getElementById('weather').innerHTML = `<p>${data.message}</p>`;
                }

            }
            catch(error){
                console.log(error);
                document.getElementById('weather').innerHTML = `
                  <p>Failed to read data</p>
                `;
                }
        }

    </script>
    
</body>
</html>
