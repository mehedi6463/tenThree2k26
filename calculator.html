<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <main class="page">
        <section class="calculator" aria-label="Calculator">
            <header class="calculator-header">
                <div>
                    <p class="eyebrow">Simple</p>
                    <h1>Calculator</h1>
                </div>
                <div class="calculator-icon" aria-hidden="true">🧮</div>
            </header>

            <div class="display">
                <p class="expression" aria-live="polite"></p>
                <output class="display-value" id="display" aria-label="Display" aria-live="polite">0</output>
            </div>

            <div class="keypad" aria-label="Calculator keypad" id="keypad">
                <button class="key key-muted" type="button" data-action="clear">AC</button>
                <button class="key key-muted" type="button" data-action="sign" aria-label="Toggle sign">+/−</button>
                <button class="key key-muted" type="button" data-action="percent">%</button>
                <button class="key key-operator" type="button" data-operator="/" aria-label="Divide">÷</button>

                <button class="key" type="button" data-digit="7">7</button>
                <button class="key" type="button" data-digit="8">8</button>
                <button class="key" type="button" data-digit="9">9</button>
                <button class="key key-operator" type="button" data-operator="*" aria-label="Multiply">×</button>

                <button class="key" type="button" data-digit="4">4</button>
                <button class="key" type="button" data-digit="5">5</button>
                <button class="key" type="button" data-digit="6">6</button>
                <button class="key key-operator" type="button" data-operator="-" aria-label="Subtract">−</button>

                <button class="key" type="button" data-digit="1">1</button>
                <button class="key" type="button" data-digit="2">2</button>
                <button class="key" type="button" data-digit="3">3</button>
                <button class="key key-operator" type="button" data-operator="+" aria-label="Add">+</button>

                <button class="key key-muted" type="button" data-action="backspace" aria-label="Delete last digit">⌫</button>
                <button class="key" type="button" data-digit="0">0</button>
                <button class="key" type="button" data-action="decimal" aria-label="Decimal point">.</button>
                <button class="key key-equals" type="button" data-action="equals">=</button>
            </div>
            <p class="hint">Use your keyboard or tap the buttons</p>
        </section>
    </main>
    <script src="calculator.js"></script>
</body>
</html>
